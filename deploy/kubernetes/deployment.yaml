apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero2hacker-backend
  namespace: zero2hacker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: zero2hacker-backend
  template:
    metadata:
      labels:
        app: zero2hacker-backend
    spec:
      containers:
      - name: backend
        image: zero2hacker/backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: zero2hacker-secrets
              key: database-url
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zero2hacker-frontend
  namespace: zero2hacker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zero2hacker-frontend
  template:
    metadata:
      labels:
        app: zero2hacker-frontend
    spec:
      containers:
      - name: frontend
        image: zero2hacker/frontend:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "250m"

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: zero2hacker
spec:
  selector:
    app: zero2hacker-backend
  ports:
  - protocol: TCP
    port: 8000
    targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: zero2hacker
spec:
  selector:
    app: zero2hacker-frontend
  ports:
  - protocol: TCP
    port: 3000
    targetPort: 3000
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zero2hacker-ingress
  namespace: zero2hacker
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - zero2hacker.com
    - api.zero2hacker.com
    secretName: zero2hacker-tls
  rules:
  - host: zero2hacker.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 3000
  - host: api.zero2hacker.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8000

---
apiVersion: v1
kind: Secret
metadata:
  name: zero2hacker-secrets
  namespace: zero2hacker
type: Opaque
data:
  database-url: <base64-encoded-database-url>
  secret-key: <base64-encoded-secret-key>
  firebase-private-key: <base64-encoded-firebase-key>